<script>
(function () {
  var r = document.documentElement;
  function light() {
    if (r.classList.contains('dark')) r.classList.remove('dark');
    if (r.getAttribute('data-theme') === 'dark') r.setAttribute('data-theme', 'light');
  }
  light();
  new MutationObserver(light).observe(r, { attributes: true, attributeFilter: ['class', 'data-theme'] });
})();
